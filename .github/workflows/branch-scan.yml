# branch-scan: early alert on PR events (opened, reopened, new commits) and on tag pushes.
# Governed file: Rival review, George's go, and George's merge. The Referee's check is the wall.
# Scan what the PR adds to main, or a pushed tag's range, using main's trusted rules and the pushed
# commits as data. Best effort: a PR, or a tag on a commit, that edits or skips this workflow may
# not alert (GitHub runs a push event's workflow from the tagged commit), and GitHub creates no
# push event at all when more than three tags are pushed at once.
# Tags stay on push here because the six-hourly push-log-scan reads GitHub's activity log, and a
# read-only check on 11/17/2026 found no tag pushes recorded there. Branches with no PR lose the
# immediate push alert; push-log-scan still scans their pushed ranges, including deleted or
# replaced tips. Keep that coverage and the Referee's six-hour retry backstop.
# Cleanup: .github/ci/PUSH-RULES.md.
name: branch-scan
on:
  pull_request:
    types: [opened, reopened, synchronize]
  # Tags only (no branches key, so branch pushes do not run this): the activity log lists no tag pushes.
  push:
    tags: ['**']
permissions:
  contents: read
# No concurrency group: canceling a waiting run would skip a PR update or a tag push.
jobs:
  scan:
    # A deleted tag has nothing to scan.
    if: github.event_name != 'push' || github.event.deleted != true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      result: ${{ steps.rules.outputs.result }}
      summary: ${{ steps.rules.outputs.summary }}
    steps:
      - name: main's copy of the rules (never the PR branch's)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            .github/ci/push-rules.sh
            .gitleaks.toml
            .gitleaksignore
          sparse-checkout-cone-mode: false
      - name: pinned gitleaks 8.30.1 (checksum checked)
        run: |
          curl --fail --silent --show-error --location -o gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gl.tgz" | sha256sum -c -
          tar xzf gl.tgz gitleaks && sudo install gitleaks /usr/local/bin/gitleaks
      - name: push rules over the PR's or the tag's range
        id: rules
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN: ${{ github.event.repository.default_branch }}
          TRUSTED_DIR: ${{ github.workspace }}/trusted
          # PR: all zeros, so scan merge-base with main .. the PR head.
          # Tag push: the pushed range (a new tag: merge-base with main .. the tag).
          BEFORE: ${{ github.event_name == 'push' && github.event.before || '0000000000000000000000000000000000000000' }}
          AFTER: ${{ github.event_name == 'push' && github.event.after || github.event.pull_request.head.sha }}
          # Never equal MAIN: a fork PR whose branch is named main, or a tag named main (full refs/tags/ name).
          REF: ${{ github.event_name == 'push' && github.ref || format('refs/pull/{0}/head', github.event.pull_request.number) }}
          SCAN_DEPTH: '500'
          PUBLIC_REPO: ${{ github.event.repository.private && 'no' || 'yes' }}
        run: |
          export SUMMARY="$RUNNER_TEMP/summary.md"; : >"$SUMMARY"; rc=0
          if [ ! -f "$TRUSTED_DIR/.github/ci/push-rules.sh" ]; then
            echo "cannot evaluate: the push rules are not on main yet (expected only on the setup PR's branch)" >>"$SUMMARY"; rc=2
          else
            if [ "$PUBLIC_REPO" = yes ]; then   # a public run log is readable by anyone: no scanner output at all
              bash "$TRUSTED_DIR/.github/ci/push-rules.sh" "$BEFORE" "$AFTER" "$REF" >/dev/null 2>&1 || rc=$?
            else
              bash "$TRUSTED_DIR/.github/ci/push-rules.sh" "$BEFORE" "$AFTER" "$REF" || rc=$?
            fi
          fi
          case $rc in 0) result=clean ;; 4) result=held; rc=0 ;; *) result=failed ;; esac
          if [ "$PUBLIC_REPO" = yes ]; then   # counts only, never paths or commits
            n=$(grep -c . "$SUMMARY" || true); echo "result: $result; $n finding line(s); details withheld because this repository is public" >"$SUMMARY"
          fi
          d="EOF_$(openssl rand -hex 16)"
          { echo "result=$result"; echo "summary<<$d"; head -n 60 "$SUMMARY"; echo "$d"; } >>"$GITHUB_OUTPUT"
          cat "$SUMMARY" >>"$GITHUB_STEP_SUMMARY"
          exit "$rc"

  alert:
    needs: scan
    # Dependabot's runs get a read-only token, so they cannot post; the Referee checks its PRs.
    if: always() && github.actor != 'dependabot[bot]' && (needs.scan.result == 'failure' || needs.scan.result == 'cancelled' || needs.scan.outputs.result == 'held')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: main's copy of the alert script
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: .github/ci/alert-george.sh
          sparse-checkout-cone-mode: false
      - name: tell George (a comment on the PR; an issue for a tag or on a public repo)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY: ${{ needs.scan.outputs.summary }}
          KIND: ${{ needs.scan.outputs.result == 'held' && 'held' || 'failed' }}
          BRANCH: ${{ github.event_name == 'push' && github.ref || github.event.pull_request.head.ref }}
          TIP: ${{ github.event_name == 'push' && github.event.after || github.event.pull_request.head.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REFEREE_APP_ID: '5552272'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          printf '%s\n' "$SUMMARY" >"$RUNNER_TEMP/summary.md"
          bash trusted/.github/ci/alert-george.sh "$BRANCH" "$TIP" "$KIND" "$RUNNER_TEMP/summary.md"
