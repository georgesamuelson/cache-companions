name: Referee
on:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, edited, labeled, unlabeled]
    branches: [main]
  issue_comment:
    types: [created, edited, deleted]
  schedule:
    - cron: '7 */6 * * *'
permissions:
  contents: read
jobs:
  inspect:
    if: github.event_name != 'issue_comment' || (github.event.issue.pull_request != null && (github.event.comment.user.login == 'georgesamuelson' || github.event.comment.user.login == 'ace-samuelson[bot]'))
    concurrency:
      group: referee-${{ github.repository }}-${{ github.event.pull_request.number || github.event.issue.number || 'schedule' }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: referee
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Trusted default branch only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            .github/ci/
            .github/governance-paths
            .gitleaks.toml
            .gitleaksignore
          sparse-checkout-cone-mode: false
      - name: Pinned scanner
        run: |
          curl --fail --silent --show-error --location -o gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gl.tgz' | sha256sum -c -
          tar xzf gl.tgz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
      - name: Inspect data and publish the App-bound judgment
        env:
          GH_TOKEN: ${{ github.token }}
          TRUSTED_DIR: ${{ github.workspace }}/trusted
          REFEREE_APP_ID: '5552272'
          REFEREE_PRIVATE_KEY: ${{ secrets.REFEREE_PRIVATE_KEY }}
          ACE_APP_ID: '5552138'
          ACE_PRIVATE_KEY: ${{ secrets.ACE_PRIVATE_KEY }}
          MAIN_WALL_VERIFIED: ${{ vars.MAIN_WALL_VERIFIED }}
          GO_COUNTING_ENABLED: ${{ vars.GO_COUNTING_ENABLED }}
        run: node trusted/.github/ci/referee.mjs
